question:
  kind: capability
  ask: "With gradient_routing=stop_vlm, does the VLM stop learning from the action expert while the action expert keeps learning?"
loop:
  max_iterations: 8
  fix_code: true
benchmarks:
  - name: pi0-gradient-routing-insulation
    suite: "notebook:eval/eval_gradient_routing.ipynb"
    scorer: vlm_weight_l1_delta_stop_vlm
    baseline: none
    policy:
      guardrail_veto: true
    metrics:
      - name: vlm_weight_l1_delta_stop_vlm
        direction: min
        threshold: 0.0
        role: target
        bar: goal
        reads_as: "Sum of |weight change| over all VLM-side params after 8 Adam(wd=0) steps under stop_vlm; pass requires exactly 0.0"
      - name: vlm_weight_l1_delta_full
        direction: max
        threshold: 1.024  # floor: 8192 trunk kv-projection coords (2*1*64*16*4) x lr 1e-3 / worst-case 1-of-8 step retention
        role: guardrail
        bar: floor
        reads_as: "Same VLM-side L1 movement under default full routing; nonzero proves the expert loss couples into the trunk"
      - name: expert_weight_l1_delta_stop_vlm
        direction: max
        threshold: 5.12  # floor: 40960 expert attention coords (10240 x 4 blocks) x lr 1e-3 / 8
        role: guardrail
        bar: floor
        reads_as: "L1 movement of action-expert params (path contains _1 or action_in/out_proj) under stop_vlm; expert must keep training"
      - name: expert_weight_l1_delta_full
        direction: max
        threshold: 5.12  # same derivation as above; the expert trains under both routings
        role: guardrail
        bar: floor
        reads_as: "L1 movement of action-expert params under full routing; the expert moves in both arms per the pass rule"
      - name: loss_drop_full
        direction: max
        threshold: 0.00000015  # floor: float32-resolvable drop = eps * loss0 = 1.19e-7 * 1.33
        role: guardrail
        bar: floor
        reads_as: "Flow-matching loss decrease (before minus after, fixed eval keys) over 8 steps under full routing"
      - name: loss_drop_stop_vlm
        direction: max
        threshold: 0.00000015  # same float32-resolution floor; insulation must not stall the loss
        role: guardrail
        bar: floor
        reads_as: "Flow-matching loss decrease under stop_vlm; the loss must still fall when the trunk is insulated"
      - name: loss_step0_gap
        direction: min
        threshold: 0.0
        role: guardrail
        bar: sanity
        reads_as: "Absolute gap between the two routings' initial losses; stop_gradient is forward-identity so it must be exactly 0"
      - name: loss_before_full
        direction: max
        threshold: 0.5  # flow-matching loss at init ~ Var(noise)+Var(U(-1,1)) = 4/3
        role: diagnostic
        bar: sanity
        reads_as: "Mean flow-matching loss at the shared init, full routing, averaged over 4 fixed eval keys"
      - name: loss_after_full
        direction: max
        threshold: 0.5  # 8 steps at lr=1e-3 leave the loss O(1); catches divergence
        role: diagnostic
        bar: sanity
        reads_as: "Mean flow-matching loss after 8 steps, full routing, same eval keys"
      - name: loss_before_stop_vlm
        direction: max
        threshold: 0.5  # identical to full arm's initial loss by forward-identity
        role: diagnostic
        bar: sanity
        reads_as: "Mean flow-matching loss at the shared init, stop_vlm routing"
      - name: loss_after_stop_vlm
        direction: max
        threshold: 0.5
        role: diagnostic
        bar: sanity
        reads_as: "Mean flow-matching loss after 8 steps, stop_vlm routing, same eval keys"
      - name: vlm_param_count
        direction: max
        threshold: 16000000  # embedder 257152*64 = 16.46M + 4 trunk blocks + tower >= 16.56M
        role: diagnostic
        bar: sanity
        reads_as: "VLM-side parameter coordinate count in the partition; verifies the VLM bucket is the big one"
      - name: expert_param_count
        direction: max
        threshold: 100000  # 4 x 26752 expert-block coords + ~2k action in/out proj coords ~ 109k
        role: diagnostic
        bar: sanity
        reads_as: "Action-expert parameter coordinate count; if ~0 the path-based partition is broken"
compute:
  tier: cpu
  timeout_s: 900  # 2 arms x (jit compile ~2-4 min + 8 tiny steps + 8 evals) ~ 6-10 min; user cap 20 min
held_constant:
  - "bit-identical init: both arms from Pi0Config(dummy,dummy,action_dim=8,action_horizon=4,max_token_len=16,dtype=float32).create(jax.random.key(0))"
  - "one fixed random batch built from jax.random keys 1-4 exactly as in the PR's action_token_supervision_test.py"
  - "identical per-step noise/timestep keys: jax.random.fold_in(jax.random.key(7), step), same step index in both arms"
  - "identical 4 eval keys fold_in(key(101), i) for before/after losses in both arms"
  - "hand-built Adam lr=1e-3, b1=0.9, b2=0.999, eps=1e-8, weight_decay=0, 8 steps (REMYX_SMOKE=1 -> 2 steps), float32"
  - "action_token_supervision=False so no auxiliary CE term touches the VLM and the exact-zero criterion is meaningful"
  - "PR-only config kwargs (gradient_routing, action_token_supervision) are applied only when present in Pi0Config's dataclass fields; the baseline falls back to pre-change full routing instead of TypeError"
  - "parameter partition by the repo test convention: expert side = flat path contains '_1' or 'action_in_proj'/'action_out_proj'; everything else is VLM side"
avoid:
  - "no datasets, checkpoints, or network fetches; both transformer streams use the tiny dummy variants"
  - "no wall-clock timing on shared CPU; all reported quantities are deterministic weight/loss deltas"
  - "never use optax defaults or any weight_decay>0: decay moves zero-grad VLM weights and fakes a nonzero VLM delta under stop_vlm"
  - "never pass PR-only kwargs to Pi0Config unconditionally: on the pre-change baseline that is an unknown-kwarg TypeError, not a clean fallback"
  - "an 8-step dummy-scale run cannot test the paper's 25%/17%/40% training-outcome comparisons; do not read it as one"
  - "JAX backend only; the gradient_routing port in models_pytorch/pi0_pytorch.py is not exercised here"
  - "do not gate on loss_after below the initial-loss scale; 8 steps at lr=1e-3 are a mechanism probe, not convergence"
provenance:
  vlm_weight_l1_delta_stop_vlm: "user_guidance"
  vlm_weight_l1_delta_full: "user_guidance"
  expert_weight_l1_delta_stop_vlm: "user_guidance"
  expert_weight_l1_delta_full: "user_guidance"
  loss_drop_full: "user_guidance"
  loss_drop_stop_vlm: "user_guidance"
  loss_step0_gap: "inferred"
  loss_before_full: "user_guidance"
  loss_after_full: "user_guidance"
  loss_before_stop_vlm: "user_guidance"
  loss_after_stop_vlm: "user_guidance"
  vlm_param_count: "inferred"
  expert_param_count: "inferred"
  held_constant: "repo test convention from src/openpi/models/action_token_supervision_test.py"
  suite: "synthesized"
  compute: "user_guidance"
report:
  headline: "Insulation mechanism verified at dummy scale: stop_vlm leaves every VLM weight bit-identical while the action expert trains and the loss falls under both routings"
  findings:
    - "VLM-side L1 movement under stop_vlm is {vlm_weight_l1_delta_stop_vlm} (exactly 0 required) versus {vlm_weight_l1_delta_full} under full coupling"
    - "action-expert L1 movement is {expert_weight_l1_delta_stop_vlm} under stop_vlm and {expert_weight_l1_delta_full} under full"
    - "flow-matching loss falls by {loss_drop_full} under full and {loss_drop_stop_vlm} under stop_vlm, from initial values {loss_before_full} and {loss_before_stop_vlm}"
    - "initial losses agree across routings to {loss_step0_gap}, confirming the routing knob leaves forward outputs unchanged"
    - "the partition covers {vlm_param_count} VLM-side and {expert_param_count} action-expert coordinates"
  establishes:
    - "under stop_vlm the VLM trunk receives exactly zero gradient from the action expert's loss ({vlm_weight_l1_delta_stop_vlm}) while the expert keeps learning ({expert_weight_l1_delta_stop_vlm}, loss drop {loss_drop_stop_vlm})"
    - "under full routing the expert's loss does update the VLM ({vlm_weight_l1_delta_full}), so the knob switches real gradient flow rather than being a no-op"
  does_not_establish:
    - "which routing trains better on real data; the paper's 25%/17%/40% open-loop, closed-loop and manipulation deltas are out of scope at this scale"
    - "the PyTorch backend's gradient_routing port in models_pytorch/pi0_pytorch.py"
    - "action-token supervision, the PR's second knob and the other factor of the paper's 2x2 ablation"
  not_measured:
    - "open-loop trajectory-prediction error, closed-loop route progress, and robot manipulation success rate"
    - "throughput, memory, or wall-clock cost of the routing change"
  caveat: "The exact VLM zero holds only because this harness has no vision-language or action-token loss term; in the paper's insulated arms the VLM still trains, so this tests the routing mechanism, not the recipe's relative merit."
  next: "Run the paper's 2x2 (gradient routing x action-token supervision) on a real VLA dataset with open- and closed-loop evaluation to compare training outcomes."