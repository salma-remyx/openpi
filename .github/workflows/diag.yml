name: diag-claude-pgroup
on:
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
      ANTHROPIC_MODEL: glm-5.3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Claude Code at the action's pin
        run: npm install -g @anthropic-ai/claude-code@2.1.296 && claude --version
      - name: Write wrapper (mimics run.py _run_agent)
        run: |
          cat > /tmp/wrap.py <<'PY'
          import subprocess, sys, os, time
          case, secs = sys.argv[1], sys.argv[2]
          prompt = (f"Use the Bash tool to run exactly this command and wait for it to finish, "
                    f"then reply with its output: sleep {secs}; echo done-{case}")
          print(f"[{case}] wrapper pid={os.getpid()} pgid={os.getpgid(0)} sid={os.getsid(0)}", flush=True)
          t = time.time()
          p = subprocess.run(
              ["claude", "--dangerously-skip-permissions", "--model", "glm-5.3", "--max-turns", "6",
               "--output-format", "json", "-p", prompt],
              capture_output=True, text=True, timeout=900, stdin=subprocess.DEVNULL)
          print(f"[{case}] claude rc={p.returncode} in {time.time()-t:.0f}s", flush=True)
          print("STDOUT tail:", (p.stdout or "")[-700:], flush=True)
          print("STDERR tail:", (p.stderr or "")[-700:], flush=True)
          PY
      - name: Case A control (sleep 20, under the 120s Bash tool timeout)
        continue-on-error: true
        run: |
          echo "step shell pid=$$ pgid=$(ps -o pgid= $$) sid=$(ps -o sid= $$)"
          ( sleep 25; echo "== ps snapshot"; ps -eo pid,ppid,pgid,sid,etimes,cmd | grep -E 'claude|sleep 20|wrap.py' | grep -v grep ) &
          python /tmp/wrap.py control 20; echo "control wrapper exit=$?"
          wait
      - name: Case B over the Bash tool timeout (sleep 150)
        continue-on-error: true
        run: |
          echo "step shell pid=$$ pgid=$(ps -o pgid= $$) sid=$(ps -o sid= $$)"
          ( sleep 40; echo "== ps snapshot"; ps -eo pid,ppid,pgid,sid,etimes,cmd | grep -E 'claude|sleep 150|wrap.py' | grep -v grep ) &
          python /tmp/wrap.py over-timeout 150; echo "over-timeout wrapper exit=$?"
          wait
      - name: After
        if: always()
        run: echo "job still alive after both cases"
